<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glass Pulse — WebAudio WAV</title>
  <style>
    :root { --bg:#0b0b0c; --fg:#e7e7ea; }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu;}
    .wrap{display:grid;place-items:center;min-height:100vh;padding:16px;gap:12px}
    .stage{position:relative;width:min(92vw,540px);aspect-ratio:9/16;border-radius:20px;
      overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.45);background:#000}
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
    canvas{position:absolute;inset:0;width:100%;height:100%}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,.6);z-index:9;cursor:pointer}
    .cta{background:#ffffff10;border:1px solid #ffffff30;color:#fff;padding:14px 18px;
      border-radius:14px;font-size:16px;backdrop-filter: blur(6px)}
    .badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .pill{font-size:12px;opacity:.85;border:1px solid #29292e;padding:6px 10px;
      border-radius:999px;background:#17171a}
    .dot{display:inline-block;width:8px;height:8px;border-radius:999px;background:#888;margin-right:6px}
    .dot.on{background:#6ee7ff}
    .log{max-width:540px;width:100%;background:#111;border:1px solid #2b2b31;border-radius:12px;
      padding:10px;font-size:12px;line-height:1.35;white-space:pre-wrap}
    .ok{color:#9BEF8A} .warn{color:#FFD166} .err{color:#FF6B6B}
  </style>
</head>

  <div class="log" id="log"></div>
